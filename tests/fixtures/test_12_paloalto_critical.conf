# ============================================================
# TEST FILE 12: Palo Alto - CRITICAL (set format)
# Device: pa-branch-legacy
# Scenario: Branch firewall left close to its defaults
# ============================================================
set deviceconfig system hostname pa-branch-legacy
set deviceconfig system timezone UTC
set deviceconfig system service disable-telnet no
set deviceconfig system service disable-http no
set deviceconfig system snmp-setting access-setting version v2c snmp-community-string public
set mgt-config users admin phash $1$abcdefgh$N3bq3SJvXOhS1Vq0hR5ne/
set mgt-config users admin permissions role-based superuser yes
set network profiles interface-management-profile allow-all telnet yes
set network profiles interface-management-profile allow-all http yes
set network profiles interface-management-profile allow-all ping yes
set network interface ethernet ethernet1/1 layer3 ip 198.51.100.2/30
set network interface ethernet ethernet1/1 layer3 interface-management-profile allow-all
set network interface ethernet ethernet1/2 layer3 ip 192.168.50.1/24
set network interface ethernet ethernet1/2 comment "Branch LAN"
set network interface ethernet ethernet1/3 link-state auto
set rulebase security rules any-any from any
set rulebase security rules any-any to any
set rulebase security rules any-any source any
set rulebase security rules any-any destination any
set rulebase security rules any-any application any
set rulebase security rules any-any service any
set rulebase security rules any-any action allow
set rulebase security rules old-open-rule source any
set rulebase security rules old-open-rule destination any
set rulebase security rules old-open-rule application any
set rulebase security rules old-open-rule service any
set rulebase security rules old-open-rule action allow
set rulebase security rules old-open-rule disabled yes
set rulebase security rules "vendor access" source [ 198.51.100.50 198.51.100.51 ]
set rulebase security rules "vendor access" destination any
set rulebase security rules "vendor access" application any
set rulebase security rules "vendor access" service any
set rulebase security rules "vendor access" action allow
