config system global
    set hostname fortinet-fg-critical
    set admintimeout 480
    set admin-sport 80
    set strong-crypto disable
end

# ============================================================
# TEST FILE 9: Fortinet — CRITICAL (Expected Score: ~4/100)
# Device: fortinet-fg-critical
# Scenario: Badly misconfigured FortiGate — all violations
# ============================================================

config system admin
    edit "admin"
        set password ""
    next
    edit "test"
        set password "test"
    next
    edit "backup"
        set password "backup123"
    next
end

config system interface
    edit "wan1"
        set description "WAN"
        set allowaccess ping http https ssh telnet fgfm
    next
    edit "wan2"
        set allowaccess http https telnet ping
    next
    edit "internal"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess all
    next
    edit "dmz"
        set allowaccess all
    next
    edit "port5"
        set allowaccess all
    next
    edit "port6"
        set allowaccess all
    next
end

config system snmp sysinfo
    set status enable
end

config system snmp community
    edit 1
        set name "public"
        set status enable
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
    edit 2
        set name "private"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end

# VIOLATION: No syslog configured
config log syslogd setting
    set status disable
end

# VIOLATION: No NTP configured
config system ntp
    set type disable
end

# VIOLATION: Wide-open firewall policy
config firewall policy
    edit 1
        set name "Allow-Everything"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end
