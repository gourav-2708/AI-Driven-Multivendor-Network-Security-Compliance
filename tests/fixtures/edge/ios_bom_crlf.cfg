! Edge case: UTF-8 BOM, CRLF line endings, '!' inside a community string
version 17.3
hostname edge-ios
enable secret 9 $9$abc
service password-encryption
aaa new-model
ip ssh version 1
no cdp run
no ip http server
ip http secure-server
username ops privilege 15 secret Op$Secret1
snmp-server community Str0ng!Comm#2024 RO SNMP_ACL
snmp-server community weakro RO
logging host vrf MGMT 192.0.2.50
logging buffered 32768
ntp server vrf MGMT 192.0.2.10
ntp authenticate
interface GigabitEthernet0/0
 description Uplink to core - primary
 ip address 192.0.2.1 255.255.255.0
 ip access-group EDGE_IN in
!
interface Management1
 ip address dhcp
!
interface GigabitEthernet0/9
 shutdown
!
ip access-list extended EDGE_IN
 10 remark allow web
 20 permit tcp any any eq 443
 30 permit ip 10.0.0.0 0.255.255.255 any
 40 deny ip any any log
access-list 99 permit any
line vty 0 4
 transport input ssh
end
