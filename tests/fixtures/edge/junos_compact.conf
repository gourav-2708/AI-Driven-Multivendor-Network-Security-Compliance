/* Edge case: compact one-line blocks, inactive statements, annotations */
system { host-name edge-junos; services { inactive: telnet; ssh { protocol-version v2; } web-management { https { port 8443; } } }
  authentication-order [ radius password ]; radius-server { 192.0.2.5 secret "$9$x"; }
  syslog { host 192.0.2.50 { any notice; } file messages { any info; } }
  ntp { server 192.0.2.10 key 7; authentication-key 7 type sha256 value "$9$y"; }
}
snmp { community "Ab3$xY9!kLmn" { authorization read-only; client-list-name NMS; } }
interfaces {
    ge-0/0/0 { description "Core uplink"; unit 0 { family inet { filter { input EDGE_IN; } address 192.0.2.1/24; } } }
    ge-0/0/1 { disable; }
    fxp0 { unit 0 { family inet { filter input MGMT_IN; address 10.255.0.1/24; } } }
}
firewall { family inet { filter EDGE_IN {
    term web { from { protocol tcp; destination-port 443; } then accept; }
    term rest { then { discard; } }
} } }
