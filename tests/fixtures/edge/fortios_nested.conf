#config-version=FGT100F-7.2.5
config system global
    set hostname "edge fortigate"
    set admin-telnet disable
end
config system admin
    edit "admin"
        set password ENC SH2abcdef0123456789
        set accprofile "super_admin"
    next
end
config user radius
    edit "corp-radius"
        set server "192.0.2.5"
    next
end
config system interface
    edit "port1"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set description "uplink"
    next
    edit "port2"
        set mode dhcp
        set allowaccess ping
    next
end
config system snmp community
    edit 1
        set name "Q7#vLm2!pZ"
        config hosts
            edit 1
                set ip 192.0.2.100 255.255.255.255
            next
        end
    next
    edit 2
        set name "public"
        set status disable
    next
end
config log syslogd setting
    set status disable
    set server "192.0.2.50"
end
config log syslogd2 setting
    set status enable
    set server "192.0.2.51"
end
config log memory setting
    set status enable
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config firewall policy
    edit 10
        set name "deny-all"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
    next
    edit 11
        set name "disabled-open"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set status disable
    next
    edit 12
        set name "web-only"
        set srcaddr "all"
        set dstaddr "all"
        set service "HTTPS"
        set action accept
    next
end
