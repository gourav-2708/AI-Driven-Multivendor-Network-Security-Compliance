#config-version=FGT60F-v7.0.5-build0304
#conf_file_ver=7005000430
#buildno=0304
#global_vdom=1
config system global
    set hostname FortiGate-Branch
    set strong-crypto disable
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.252
        ## VIOLATION: HTTP and Telnet allowed on management access (SVC-001, AUTH-003)
        set allowaccess ping https ssh http telnet
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.0.3.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    ## VIOLATION: Management interface with no restricting policy applied (ACL-002)
    edit "mgmt"
        set vdom "root"
        set ip 192.168.100.1 255.255.255.0
        set allowaccess ping https ssh http
        set role lan
        set description "OOB Management"
    next
    ## VIOLATION: Interface with no IP (INTF-001)
    edit "dmz"
        set vdom "root"
        set type physical
    next
end
config system admin
    edit "admin"
        ## VIOLATION: Plaintext password (PASSWD-001, AUTH-001)
        set password fortiadmin123
        set accprofile "super_admin"
    next
end
## VIOLATION: No AAA/RADIUS configured (AUTH-002)
config system snmp sysinfo
    set status enable
    set description "Branch FortiGate"
end
## VIOLATION: SNMP with default public community (SNMP-001, SNMP-002)
config system snmp community
    edit 1
        set name "public"
        set query-v1-status enable
        set query-v2c-status enable
        set trap-v1-status enable
    next
end
## VIOLATION: NTP not configured with server (NTP-001)
config system ntp
    set ntpsync disable
end
## VIOLATION: Syslog not configured (LOG-001)
config log syslogd setting
    set status disable
end
config firewall policy
    edit 1
        set name "Allow_All_Outbound"
        ## VIOLATION: Source any, dest any = permit any any (ACL-001)
        set srcaddr "all"
        set dstaddr "all"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
