## ============================================================
## TEST FILE 7: Juniper — MEDIUM (Expected Score: ~40/100)
## Device: juniper-mx-datacenter
## Scenario: Data center router, partially secured
## ============================================================
system {
    host-name juniper-mx-datacenter;

    ## GOOD: Encrypted authentication
    root-authentication {
        encrypted-password "$6$XyZaBcDe$anotherlongencryptedhashstring";
    }

    ## VIOLATION: Telnet still enabled alongside SSH
    services {
        ssh {
            root-login deny;
            protocol-version v2;
        }
        telnet;
        netconf {
            ssh;
        }
    }

    ## GOOD: Syslog to remote host
    syslog {
        host 10.5.0.100 {
            any info;
        }
        file messages {
            any notice;
        }
    }

    ## GOOD: NTP configured
    ntp {
        server 10.5.0.50;
        server 10.5.0.51;
    }
    ## VIOLATION NTP-002: No NTP authentication

    ## VIOLATION SNMP-001: Weak community string
    snmp {
        community datacenter {
            authorization read-only;
        }
        community dcwrite {
            authorization read-write;
        }
    }
}

interfaces {
    xe-0/0/0 {
        description "Core-Uplink-A";
        unit 0 {
            family inet {
                address 10.5.1.1/30;
            }
        }
    }
    xe-0/0/1 {
        description "Core-Uplink-B";
        unit 0 {
            family inet {
                address 10.5.1.5/30;
            }
        }
    }
    xe-0/0/2 {
        description "Server-Rack-1";
        unit 0 {
            family inet {
                address 10.5.10.1/24;
            }
        }
    }
    xe-0/0/3 {
        description "Server-Rack-2";
        unit 0 {
            family inet {
                address 10.5.11.1/24;
            }
        }
    }
    ## VIOLATION INTF-001: Active with no description
    xe-0/0/4 {
        unit 0 {
            family inet {
                address 10.5.12.1/24;
            }
        }
    }
    lo0 {
        description "Loopback";
        unit 0 {
            family inet {
                address 172.16.5.1/32;
            }
        }
    }
}

policy-options {
    policy-statement ALLOW-INTERNAL {
        term accept-rfc1918 {
            from {
                route-filter 10.0.0.0/8 orlonger;
            }
            then accept;
        }
        term reject-default {
            then reject;
        }
    }
}
