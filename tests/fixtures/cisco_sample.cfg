! Cisco IOS Configuration - Sample with intentional violations
! Device: core-router-01
!
version 15.7
!
hostname core-router-01
!
! VIOLATION: plaintext enable password (AUTH-001, PASSWD-001)
enable password C1sc0Lab
!
! No enable secret set
! No AAA (AUTH-002)
! No service password-encryption (PASSWD-001)
!
! SSH not explicitly configured (AUTH-004)
! Telnet is default on VTY
!
! CDP running globally (SVC-002)
cdp run
!
! Small servers enabled (SVC-003)
service tcp-small-servers
service udp-small-servers
!
! HTTP server without HTTPS (SVC-001)
ip http server
!
! SNMP with default community string (SNMP-001), no restricting ACL (SNMP-002)
snmp-server community public RO
snmp-server community private RW
!
username admin privilege 15 password AdminPass123
!
! Interfaces
interface GigabitEthernet0/0
 description WAN Uplink
 ip address 203.0.113.1 255.255.255.252
 ip access-group INBOUND_WAN in
 no cdp enable
 no shutdown
!
interface GigabitEthernet0/1
 description Internal LAN
 ip address 10.0.1.1 255.255.255.0
 no shutdown
!
! VIOLATION: Management interface with no ACL (ACL-002)
interface GigabitEthernet0/2
 description Management
 ip address 192.168.100.1 255.255.255.0
 no shutdown
!
! Loopback
interface Loopback0
 ip address 172.16.0.1 255.255.255.255
 no shutdown
!
! VIOLATION: Active interface with no IP or description (INTF-001)
interface GigabitEthernet0/3
 no shutdown
!
! ACL - VIOLATION: permit any any (ACL-001)
ip access-list extended INBOUND_WAN
 permit ip any host 203.0.113.1
 deny   ip any any log
!
ip access-list extended INSECURE_ACL
 permit ip any any
!
! VTY lines - VIOLATION: Telnet permitted (AUTH-003)
line vty 0 4
 transport input telnet
 login local
!
! No NTP configured (NTP-001)
! No logging server configured (LOG-001)
! No buffered logging (LOG-002)
!
end
