! ============================================================
! TEST FILE 3: Cisco — MEDIUM (Expected Score: ~45/100)
! Device: campus-distribution-sw
! Scenario: Campus switch — partially hardened
! ============================================================
version 15.2
!
hostname campus-distribution-sw
!
! GOOD: Enable secret set
enable secret 5 $1$mERr$VBkSmJuFDRyFdKijMlHNe0
!
! GOOD: Password encryption on
service password-encryption
!
! GOOD: AAA configured
aaa new-model
aaa authentication login default local
!
! VIOLATION AUTH-004: No SSH configured
! VIOLATION AUTH-003: Telnet still allowed on VTY
!
! VIOLATION SVC-002: CDP still running
cdp run
!
! GOOD: Small servers disabled
no service tcp-small-servers
no service udp-small-servers
!
! VIOLATION SVC-001: HTTP server enabled
ip http server
!
! VIOLATION SNMP-001: Weak community string
snmp-server community companyRO RO
snmp-server community companyRW RW
!
username netadmin privilege 15 secret NetAdmin!2024
username monitor privilege 5 secret Monitor!2024
!
interface GigabitEthernet1/0/1
 description Uplink-to-Core
 ip address 10.1.1.2 255.255.255.252
 ip access-group UPLINK_IN in
 no cdp enable
 no shutdown
!
interface GigabitEthernet1/0/2
 description Server-Farm
 ip address 10.1.2.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet1/0/3
 description User-VLAN
 ip address 10.1.3.1 255.255.255.0
 no shutdown
!
! VIOLATION INTF-001: Unused port not shut down
interface GigabitEthernet1/0/24
 no shutdown
!
ip access-list extended UPLINK_IN
 permit ip 10.0.0.0 0.255.255.255 any
 deny   ip any any log
!
! VIOLATION AUTH-003: Telnet allowed
line vty 0 15
 transport input telnet ssh
 login authentication default
 exec-timeout 15 0
!
! GOOD: NTP configured (no auth though)
ntp server 10.0.1.100
!
! VIOLATION NTP-002: No NTP authentication
!
! GOOD: Logging configured
logging host 10.0.1.200
logging buffered 8192
!
end
