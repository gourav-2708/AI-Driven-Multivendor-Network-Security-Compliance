! Command: show running-config
! device: dc1-leaf-secure (DCS-7050SX3-48YC8, EOS-4.28.3M)
!
! ============================================================
! TEST FILE 13: Arista - SECURE
! Device: dc1-leaf-secure
! Scenario: Hardened data-centre leaf switch
! ============================================================
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging buffered 10000
logging host 10.40.1.50
!
hostname dc1-leaf-secure
!
ntp authenticate
ntp authentication-key 1 sha1 7 0711233F4D1C0B1E
ntp trusted-key 1
ntp server 10.40.1.10 key 1
ntp server 10.40.1.11 key 1
!
snmp-server group NMS v3 priv
snmp-server user nms NMS v3 auth sha 6d1f0c2e9a priv aes 7b3a9d0c11
!
aaa group server tacacs+ TAC
   server 10.40.1.20
!
aaa authentication login default group TAC local
aaa authorization exec default group TAC local
aaa authentication policy lockout failure 5 window 300 duration 900
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Zt1qK0pW$u7eTq2hX9mYcD4vB8nL1sR6aJ3fG5kP0oI2wE7zU
!
interface Ethernet1
   description Uplink to spine1
   no switchport
   ip address 10.40.0.1/31
!
interface Ethernet2
   description Server rack 12
   switchport access vlan 120
!
interface Ethernet3
   shutdown
!
interface Management1
   description OOB management
   ip address 10.40.255.11/24
   ip access-group MGMT-IN in
!
ip access-list MGMT-IN
   10 permit tcp 10.40.1.0/24 any eq ssh
   20 permit udp 10.40.1.0/24 any eq snmp
   30 deny ip any any log
!
ip access-list standard SSH-SOURCES
   10 permit 10.40.1.0/24
!
banner login
Authorized users only. Activity is monitored.
enable password this-line-is-banner-text
EOF
!
management api http-commands
   no shutdown
!
management console
   idle-timeout 10
!
management security
   password minimum length 14
!
management ssh
   idle-timeout 10
   ip access-group SSH-SOURCES in
!
end
