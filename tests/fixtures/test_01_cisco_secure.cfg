! ============================================================
! TEST FILE 1: Cisco — SECURE (Expected Score: ~85/100)
! Device: branch-firewall-secure
! Scenario: Well-hardened branch office router
! ============================================================
version 15.7
!
hostname branch-firewall-secure
!
! GOOD: Enable secret (encrypted)
enable secret 9 $9$mlHL0S5EiKBgaE$ClKpyMgU4rOfGq9k/PleB3O/JZ7pEPqEYrTsQ8CVXLU
!
! GOOD: Service password encryption ON
service password-encryption
!
! GOOD: AAA authentication
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
! GOOD: SSH v2 only
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
crypto key generate rsa modulus 2048
!
! GOOD: No CDP globally
no cdp run
!
! GOOD: No small servers
no service tcp-small-servers
no service udp-small-servers
!
! GOOD: HTTPS only, no HTTP
no ip http server
ip http secure-server
!
! GOOD: SNMP with non-default community and ACL
snmp-server community Xr7!mN2qP RO 10
snmp-server host 10.0.1.200 version 2c Xr7!mN2qP
!
username admin privilege 15 secret AdminSecret!456
!
! Interfaces
interface GigabitEthernet0/0
 description WAN-Uplink
 ip address 203.0.113.5 255.255.255.252
 ip access-group INBOUND_WAN in
 no cdp enable
 no shutdown
!
interface GigabitEthernet0/1
 description Internal-LAN
 ip address 10.10.1.1 255.255.255.0
 ip access-group LAN_IN in
 no shutdown
!
interface GigabitEthernet0/2
 description Management
 ip address 192.168.1.1 255.255.255.0
 ip access-group MGMT_ACL in
 no shutdown
!
! GOOD: ACL with no permit any any
ip access-list extended INBOUND_WAN
 permit tcp any host 203.0.113.5 eq 22
 deny   ip any any log
!
ip access-list extended MGMT_ACL
 permit ip 192.168.1.0 0.0.0.255 any
 deny   ip any any log
!
ip access-list extended LAN_IN
 permit ip 10.10.1.0 0.0.0.255 any
 deny   ip any any
!
! GOOD: Telnet disabled, SSH only
line vty 0 4
 transport input ssh
 login authentication default
 exec-timeout 10 0
!
! GOOD: NTP configured with authentication
ntp authenticate
ntp authentication-key 1 md5 NtpSecureKey!
ntp trusted-key 1
ntp server 10.0.1.100 key 1
!
! GOOD: Logging configured
logging host 10.0.1.200
logging buffered 16384 informational
logging trap informational
!
end
