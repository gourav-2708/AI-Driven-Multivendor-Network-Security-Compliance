{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Choose a password{% endblock %}
{% block subnav_bar %}{% endblock %}
{% block content %}
<section class="auth">
  <form class="auth-card form" method="post">
    {{ csrf() }}
    <div>
      <h1>Choose a password</h1>
      <p class="lede">For <b>{{ email }}</b>. Use at least 12 characters.</p>
    </div>
    <label>New password <input class="input" type="password" name="password" minlength="12" autocomplete="new-password" required autofocus></label>
    <label>Repeat it <input class="input" type="password" name="confirm" minlength="12" autocomplete="new-password" required></label>
    <button class="btn btn-primary" type="submit">Save password</button>
  </form>
</section>
{% endblock %}
