<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Multi-vendor network security compliance auditor">
  <meta name="theme-color" content="#05070d">
  <title>{% block title %}Audit{% endblock %} · net-audit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070d'/%3E%3Cpath d='M9 24l5-16h3l-5 16zM16 24l5-16h3l-5 16z' fill='%232f6bff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="nav {% block nav_class %}always{% endblock %}" id="nav">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}" aria-label="net-audit home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>net-audit
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="{{ url_for('index') }}#audit" class="{{ 'active' if request.endpoint == 'index' }}">Audit</a>
        <a href="{{ url_for('history_page') }}" class="{{ 'active' if request.endpoint == 'history_page' }}">History</a>
      </nav>
      <div class="nav-right">
        <span class="status-pill {{ '' if binary_exists else 'off' }}" role="status"
              title="{{ 'Auditor engine ready' if binary_exists else 'Auditor engine not built' }}">
          <i aria-hidden="true"></i><span>{{ 'Engine ready' if binary_exists else 'Engine offline' }}</span>
        </span>
        <a class="btn btn-primary btn-sm nav-cta" href="{{ url_for('index') }}#audit">New audit</a>
      </div>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>net-audit · deterministic multi-vendor compliance auditing</span>
      <span>Cisco IOS · Juniper JunOS · Fortinet FortiOS</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
