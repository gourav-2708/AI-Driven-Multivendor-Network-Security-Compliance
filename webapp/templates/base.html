<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}net-audit{% endblock %} - Network Compliance Auditor</title>

  <!-- Bootstrap 5 dark -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Custom styles -->
  <link href="{{ url_for('static', filename='css/style.css') }}?v={{ range(1000,9999)|random }}" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar d-flex flex-column p-0">
  <a href="/" class="sidebar-brand">
    <i class="bi bi-shield-check"></i>
    <span>net-audit</span>
  </a>
  <nav class="sidebar-nav flex-grow-1">
    <a href="/" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
      <i class="bi bi-house-door"></i> Dashboard
    </a>
    <a href="/history" class="nav-item {% if request.endpoint == 'history_page' %}active{% endif %}">
      <i class="bi bi-clock-history"></i> History
    </a>
  </nav>
  <div class="sidebar-footer">
    <span class="text-muted small"><i class="bi bi-code-slash"></i> C11 . Flask . Chart.js</span>
  </div>
</div>

<!-- Main content -->
<div class="main-content">
  <!-- Top bar -->
  <div class="topbar">
    <h5 class="mb-0 fw-semibold">{% block page_title %}Dashboard{% endblock %}</h5>
    <div class="d-flex align-items-center gap-2">
      {% if not binary_exists is defined or binary_exists %}
        <span class="badge bg-success"><i class="bi bi-cpu"></i> Auditor Ready</span>
      {% else %}
        <span class="badge bg-danger"><i class="bi bi-exclamation-triangle"></i> Binary Missing</span>
      {% endif %}
    </div>
  </div>

  <div class="content-area">
    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
