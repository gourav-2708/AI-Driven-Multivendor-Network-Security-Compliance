name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: linux / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      # Newer kernels use 32-bit mmap randomisation, which older ASan
      # runtimes cannot handle (endless "AddressSanitizer:DEADLYSIGNAL").
      - name: Reduce ASLR entropy for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Release build + tests + CLI smoke run
        run: make CC=${{ matrix.cc }} check
      - name: Sanitized build (ASan + UBSan) + tests
        run: make CC=${{ matrix.cc }} MODE=debug test
      - name: Valgrind
        if: matrix.cc == 'gcc'
        run: make valgrind
      - name: Web dashboard tests
        if: matrix.cc == 'gcc'
        run: |
          python3 -m pip install --quiet -r frontends/web/requirements.txt
          python3 -m unittest discover -s frontends/web/tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-hosted image
        run: docker build -t net-audit .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name net-audit -p 8080:8080 net-audit
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && exit 0
            sleep 1
          done
          docker logs net-audit
          exit 1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=clang check
      - run: make CC=clang MODE=debug test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: make check
