## ============================================================
## TEST FILE 5: Juniper — SECURE (Expected Score: ~80/100)
## Device: juniper-srx-secure
## Scenario: Hardened Juniper SRX firewall
## ============================================================
system {
    host-name juniper-srx-secure;
    domain-name corp.internal;

    ## GOOD: Encrypted root authentication
    root-authentication {
        encrypted-password "$6$AbCdEfGh$verylongencryptedpasswordhashhere";
    }

    ## GOOD: SSH only, no telnet
    services {
        ssh {
            root-login deny;
            protocol-version v2;
            max-sessions-per-connection 5;
            connection-limit 10;
            rate-limit 5;
        }
        netconf {
            ssh;
        }
    }

    ## GOOD: Syslog to remote server
    syslog {
        host 10.0.1.200 {
            any info;
            authorization info;
        }
        file messages {
            any notice;
            authorization info;
        }
        file security {
            authorization any;
            interactive-commands any;
        }
    }

    ## GOOD: NTP with authentication
    ntp {
        authentication-key 1 type md5 value "NtpAuth!Key";
        server 10.0.1.100 {
            key 1;
        }
        trusted-key 1;
    }

    ## GOOD: SNMP with restricted access
    snmp {
        community Jnpr!SecureRO {
            authorization read-only;
            clients {
                10.0.1.0/24;
            }
        }
        trap-group security {
            targets {
                10.0.1.200;
            }
        }
    }
}

## GOOD: Firewall zones and policies
security {
    zones {
        security-zone trust {
            interfaces {
                ge-0/0/1.0;
                ge-0/0/2.0;
            }
            host-inbound-traffic {
                system-services {
                    ssh;
                    ping;
                }
            }
        }
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy allow-outbound {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone untrust to-zone trust {
            policy deny-inbound {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log { session-init; }
                }
            }
        }
    }
}

interfaces {
    ge-0/0/0 {
        description "WAN-Uplink";
        unit 0 {
            family inet {
                address 203.0.113.20/30;
            }
        }
    }
    ge-0/0/1 {
        description "Internal-LAN";
        unit 0 {
            family inet {
                address 10.20.1.1/24;
            }
        }
    }
    ge-0/0/2 {
        description "Server-Zone";
        unit 0 {
            family inet {
                address 10.20.2.1/24;
            }
        }
    }
    lo0 {
        description "Loopback-Management";
        unit 0 {
            family inet {
                address 172.16.1.1/32;
            }
        }
    }
}
