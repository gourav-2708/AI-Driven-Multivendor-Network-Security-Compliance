! ============================================================
! TEST FILE 4: Cisco — POOR (Expected Score: ~15/100)
! Device: isp-edge-router
! Scenario: ISP edge router with many gaps
! ============================================================
version 15.4
!
hostname isp-edge-router
!
! VIOLATION AUTH-001: Plaintext enable password
enable password ISPedge!99
!
! VIOLATION PASSWD-001: No encryption
! VIOLATION AUTH-002: No AAA
!
! GOOD: SSH configured
ip ssh version 2
crypto key generate rsa modulus 1024
!
! VIOLATION SVC-002: CDP running
cdp run
!
! GOOD: Small servers off
no service tcp-small-servers
no service udp-small-servers
!
! VIOLATION SVC-001: HTTP server on
ip http server
!
! VIOLATION SNMP-001: Default community
snmp-server community public RO
!
username isp-admin password ISPadmin2024
!
interface GigabitEthernet0/0
 description UPSTREAM-ISP
 ip address 198.51.100.2 255.255.255.252
 ip access-group WAN_IN in
 no shutdown
!
interface GigabitEthernet0/1
 description Customer-A
 ip address 10.100.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description Customer-B
 ip address 10.100.2.1 255.255.255.0
 no shutdown
!
! VIOLATION INTF-001: Undescribed active ports
interface GigabitEthernet0/3
 no shutdown
!
interface GigabitEthernet0/4
 no shutdown
!
! VIOLATION ACL-001: Wide-open ACL
ip access-list extended WAN_IN
 permit ip any any
!
! VIOLATION ACL-002: Management port with no ACL
interface GigabitEthernet0/5
 description Management
 ip address 172.16.0.1 255.255.255.0
 no shutdown
!
! GOOD: SSH only on VTY
line vty 0 4
 transport input ssh
 login local
 exec-timeout 5 0
!
! VIOLATION NTP-001: No NTP
! VIOLATION LOG-001: No logging server
! VIOLATION LOG-002: No buffered logging
!
end
