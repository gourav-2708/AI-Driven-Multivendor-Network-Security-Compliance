! ============================================================
! TEST FILE 2: Cisco — CRITICAL (Expected Score: ~2/100)
! Device: legacy-core-router
! Scenario: Old unpatched router with ALL violations
! ============================================================
version 12.4
!
hostname legacy-core-router
!
! VIOLATION AUTH-001: Plaintext enable password
enable password Cisco123
!
! VIOLATION PASSWD-001: No service password-encryption
! VIOLATION AUTH-002: No AAA
! VIOLATION AUTH-004: No SSH configured
!
! VIOLATION SVC-002: CDP enabled globally
cdp run
!
! VIOLATION SVC-003: Small servers enabled
service tcp-small-servers
service udp-small-servers
!
! VIOLATION SVC-001: HTTP server without HTTPS
ip http server
!
! VIOLATION SNMP-001: Default community strings
snmp-server community public RO
snmp-server community private RW
snmp-server community read RO
snmp-server community write RW
!
username cisco password cisco
username admin password admin123
!
! Interfaces
interface FastEthernet0/0
 description Internet
 ip address 203.0.113.10 255.255.255.248
 no shutdown
!
interface FastEthernet0/1
 description LAN
 ip address 192.168.0.1 255.255.255.0
 no shutdown
!
! VIOLATION INTF-001: Active interface with no description
interface FastEthernet0/2
 no shutdown
!
interface FastEthernet0/3
 no shutdown
!
! VIOLATION ACL-001: Permit any any rule
ip access-list extended OPEN_ACL
 permit ip any any
!
ip access-list extended ALSO_OPEN
 permit tcp any any
 permit udp any any
!
! VIOLATION ACL-002: Management with no ACL
interface FastEthernet0/4
 description Management
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
! VIOLATION AUTH-003: Telnet on all VTY lines
line vty 0 4
 transport input telnet
 password telnet123
 login
!
line vty 5 15
 transport input telnet
 password telnet123
 login
!
! VIOLATION NTP-001: No NTP configured
! VIOLATION LOG-001: No logging server
! VIOLATION LOG-002: No buffered logging
!
end
