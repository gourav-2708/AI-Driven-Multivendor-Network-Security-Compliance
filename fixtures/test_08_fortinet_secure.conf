config system global
    set hostname fortinet-fg-secure
    set admintimeout 10
    set admin-sport 4443
    set admin-ssh-port 2222
    set admin-telnet-port 0
    set strong-crypto enable
end

# ============================================================
# TEST FILE 8: Fortinet — SECURE (Expected Score: ~82/100)
# Device: fortinet-fg-secure
# Scenario: Hardened FortiGate production firewall
# ============================================================

config system admin
    edit "fwadmin"
        set accprofile "super_admin"
        set password-expire 60
        set two-factor fortitoken
        set remote-auth enable
    next
end

config system password-policy
    set status enable
    set minimum-length 14
    set must-contain upper-case lower-case non-alphanumeric numeric
    set change-4-time 365
end

config system interface
    edit "wan1"
        set alias "WAN-Primary"
        set mode dhcp
        set allowaccess ping https ssh
        set description "Primary WAN Interface"
    next
    edit "wan2"
        set alias "WAN-Backup"
        set mode dhcp
        set allowaccess ping https
        set description "Backup WAN Interface"
    next
    edit "internal"
        set alias "LAN-Segment"
        set ip 10.30.1.1 255.255.255.0
        set allowaccess ping https ssh
        set description "Internal LAN"
    next
    edit "dmz"
        set alias "DMZ-Zone"
        set ip 10.30.2.1 255.255.255.0
        set allowaccess ping https
        set description "DMZ Servers"
    next
end

config system snmp sysinfo
    set status enable
    set description "Secure FortiGate"
    set contact-info "noc@corp.internal"
    set location "DataCenter-A"
end

config system snmp community
    edit 1
        set name "FG!SecureSNMP2024"
        set status enable
        config hosts
            edit 1
                set ip 10.30.1.200 255.255.255.255
            next
        end
        set query-v2c-port 161
        set trap-v2c-lport 162
    next
end

config log syslogd setting
    set status enable
    set server "10.30.1.200"
    set port 514
    set facility local7
    set level information
end

config log memory setting
    set status enable
    set diskfull overwrite
end

config system ntp
    set type custom
    set syncinterval 60
    config ntpserver
        edit 1
            set server "10.30.1.100"
            set ntpv3 enable
            set authentication enable
            set key-type MD5
            set key 1
            set keyid 1
        next
    end
end

config firewall policy
    edit 1
        set name "LAN-to-WAN"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set ssl-ssh-profile "certificate-inspection"
    next
    edit 2
        set name "Deny-All-Inbound"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
