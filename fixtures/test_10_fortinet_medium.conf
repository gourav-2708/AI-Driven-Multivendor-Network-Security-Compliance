config system global
    set hostname fortinet-branch-medium
    set admintimeout 30
    set strong-crypto enable
end

# ============================================================
# TEST FILE 10: Fortinet — MEDIUM (Expected Score: ~42/100)
# Device: fortinet-branch-medium
# Scenario: Branch office FortiGate — mixed config
# ============================================================

config system admin
    edit "admin"
        set accprofile "super_admin"
        set password "BranchAdmin!2024"
    next
end

config system interface
    edit "wan1"
        set description "WAN-ISP"
        set mode dhcp
        set allowaccess ping https ssh
    next
    edit "internal"
        set description "LAN"
        set ip 192.168.10.1 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "dmz"
        set description "DMZ"
        set ip 192.168.20.1 255.255.255.0
        set allowaccess ping https
    next
    # VIOLATION: Interface with no description
    edit "port4"
        set ip 192.168.30.1 255.255.255.0
        set allowaccess all
    next
end

# VIOLATION: Default SNMP community
config system snmp community
    edit 1
        set name "public"
        set status enable
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end

# GOOD: Syslog enabled
config log syslogd setting
    set status enable
    set server "192.168.10.200"
    set port 514
    set level warning
end

# GOOD: NTP configured
config system ntp
    set type custom
    config ntpserver
        edit 1
            set server "pool.ntp.org"
        next
    end
end
# VIOLATION NTP-002: No NTP auth

config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic utm
    next
    # VIOLATION ACL-001: Permit any any inbound
    edit 2
        set name "Allow-Inbound-All"
        set srcintf "wan1"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end
